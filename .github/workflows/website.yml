name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Emscripten SDK and third-party sources
        uses: actions/cache@v4
        with:
          path: |
            build/emsdk
            android/third_party/src
          key: web-deps-${{ runner.os }}-emsdk-4.0.10-${{ hashFiles('android/third_party/fetch_deps.sh', 'android/third_party/patch_*.py', 'third_party/patch_unicorn.py') }}

      - name: Build the browser version
        run: web/build.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamsterball-web
          path: dist/web
          retention-days: 14

      - name: Package for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
